<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f29ab2"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kinlove Kitchen inventory"><link rel="manifest" href="manifest.json?v=4">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4"><title>Kinlove Kitchen inventory</title>
<style>
:root{--p:#f29ab2;--pl:#f8d5df;--y:#ffe8a6;--c:#fffaf5;--b:#4d3e42;--m:#927f84;--l:#f0dfe3}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fffaf5,#fff7f0);color:var(--b);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:16px;position:sticky;top:0;z-index:5;background:#fffaf5ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--l)}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:56px;height:56px;border-radius:50%}.brand h1{font-size:20px;margin:0 0 3px}.brand p{margin:0;color:var(--m);font-size:12px}
.toolbar{display:flex;gap:8px;margin-top:12px}.toolbar button{border:0;border-radius:13px;padding:10px 13px;font-weight:750;background:var(--y);color:#715b42}.toolbar button:last-child{background:var(--pl)}
main{max-width:760px;margin:auto;padding:12px 14px 35px}.section{margin:14px 0 20px;background:#ffffffbb;border:1px solid var(--l);border-radius:22px;overflow:hidden;box-shadow:0 5px 20px #dba8b31a}
.sectionHead{padding:16px;background:linear-gradient(90deg,#ffe9a9,#f9d6df);display:flex;justify-content:space-between}.sectionHead h2{font-size:16px;margin:0}.count{font-size:12px;background:#fff9;border-radius:20px;padding:5px 9px}
.row{padding:13px 14px;border-top:1px solid var(--l)}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-weight:750;font-size:16px}.unit{font-size:11px;color:var(--m);margin-left:5px}
.controls{display:flex;align-items:center;gap:7px}.controls button{width:40px;height:40px;border:0;border-radius:12px;font-size:22px;font-weight:800}.minus{background:#f7d4dd}.plus{background:var(--p);color:white}.qty{min-width:48px;text-align:center;padding:10px 6px;border-radius:12px;background:var(--y);font-weight:850;color:#b95d70}
.updated{font-size:11px;color:var(--m);margin-top:5px}.actions{display:flex;gap:7px;margin-top:9px;align-items:flex-start}.note{width:100%;min-height:43px;border:1px solid var(--l);border-radius:11px;padding:9px;background:#fffdfa;font:inherit;font-size:13px;resize:vertical}.smallbtn{border:0;border-radius:10px;padding:9px 10px;font-weight:700;background:#f8dce3;color:#a74e67;white-space:nowrap}
.dialog{position:fixed;inset:0;background:#4d3e4266;display:none;align-items:flex-end;z-index:10}.dialog.show{display:flex}.sheet{background:var(--c);width:100%;border-radius:24px 24px 0 0;padding:18px}.sheet input{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;font:inherit;margin:5px 0}.save{width:100%;padding:13px;border:0;border-radius:13px;background:var(--p);color:white;font-weight:800;margin-top:8px}.footer{text-align:center;color:var(--m);font-size:11px;padding:10px}
@media(min-width:700px){.dialog{align-items:center;justify-content:center}.sheet{max-width:480px;border-radius:24px}}
</style></head><body>

<div class="dialog" id="dialog"><div class="sheet"><h3>Add inventory item</h3><input id="newName" placeholder="Item name"><input id="newUnit" placeholder="Unit (pcs, g, pax, etc.)"><button class="save" id="saveNew">Add item</button></div></div>
<script>
const DEFAULT={"SNACKS": [{"name": "Churros", "unit": "pcs", "qty": 0, "updated": null, "note": ""}, {"name": "Popcorn original", "unit": "pcs", "qty": 0, "updated": null, "note": ""}, {"name": "Ramen mild", "unit": "pcs", "qty": 0, "updated": null, "note": ""}, {"name": "Ramen spicy", "unit": "pcs", "qty": 0, "updated": null, "note": ""}, {"name": "Fries/pax", "unit": "pax", "qty": 0, "updated": null, "note": ""}, {"name": "Pizza hawaiian", "unit": "pcs", "qty": 0, "updated": null, "note": ""}, {"name": "Pizza No meat", "unit": "pcs", "qty": 0, "updated": null, "note": ""}], "PER PIECE": [{"name": "Egg", "unit": "pcs", "qty": 0, "updated": null, "note": ""}, {"name": "Cheese (square)", "unit": "pcs", "qty": 0, "updated": null, "note": ""}, {"name": "Ham", "unit": "pcs", "qty": 0, "updated": null, "note": ""}, {"name": "Slice Bread", "unit": "pcs", "qty": 0, "updated": null, "note": ""}], "MEALS": [{"name": "Bacon/pax", "unit": "pax", "qty": 0, "updated": null, "note": ""}, {"name": "Can Cornbeef", "unit": "can", "qty": 0, "updated": null, "note": ""}, {"name": "Can CornTuna", "unit": "can", "qty": 0, "updated": null, "note": ""}, {"name": "Chicken Fillet", "unit": "pcs", "qty": 0, "updated": null, "note": ""}, {"name": "Lumpia/2", "unit": "serving", "qty": 0, "updated": null, "note": ""}, {"name": "Chicken/pax", "unit": "pax", "qty": 0, "updated": null, "note": ""}, {"name": "Pancake/pax", "unit": "pax", "qty": 0, "updated": null, "note": ""}, {"name": "Take out Box for pancake", "unit": "pcs", "qty": 0, "updated": null, "note": ""}, {"name": "Take out Sauce cup", "unit": "pcs", "qty": 0, "updated": null, "note": ""}], "CONDIMENTS & SEASONING": [{"name": "Pineapple /set", "unit": "set", "qty": 0, "updated": null, "note": ""}, {"name": "Rice / serving", "unit": "serving", "qty": 0, "updated": null, "note": ""}, {"name": "Ice / pax", "unit": "pax", "qty": 0, "updated": null, "note": ""}, {"name": "Chocolate dip", "unit": "g", "qty": 0, "updated": null, "note": ""}, {"name": "Mayo", "unit": "g", "qty": 0, "updated": null, "note": ""}, {"name": "BBQ sauce", "unit": "g", "qty": 0, "updated": null, "note": ""}, {"name": "Maggi Savor", "unit": "bottle", "qty": 0, "updated": null, "note": ""}, {"name": "White Sugar", "unit": "g", "qty": 0, "updated": null, "note": ""}, {"name": "Brown Sugar", "unit": "g", "qty": 0, "updated": null, "note": ""}, {"name": "Oil", "unit": "g", "qty": 0, "updated": null, "note": ""}, {"name": "Salt", "unit": "g", "qty": 0, "updated": null, "note": ""}, {"name": "Cinnamon", "unit": "g", "qty": 0, "updated": null, "note": ""}]};const KEY="kinlove-kitchen-inventory-v1";let data=JSON.parse(localStorage.getItem(KEY)||"null")||DEFAULT;
const app=document.getElementById("app");const stamp=()=>new Date().toLocaleString([],{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){app.innerHTML="";Object.entries(data).forEach(([cat,arr])=>{let s=document.createElement("section");s.className="section";s.innerHTML=`<div class="sectionHead"><h2>${cat}</h2><span class="count">${arr.length} item${arr.length==1?"":"s"}</span></div>`;
arr.forEach((it,i)=>{let r=document.createElement("div");r.className="row";r.innerHTML=`<div class="top"><div><span class="name"></span><span class="unit"></span></div><div class="controls"><button class="minus">−</button><span class="qty">${it.qty}</span><button class="plus">+</button></div></div><div class="updated">${it.updated?"Updated: "+it.updated:"Not updated yet"}</div><div class="actions">${cat==="CONDIMENTS & SEASONING"?'<textarea class="note" placeholder="Notes..."></textarea>':""}<button class="smallbtn delete">Delete</button></div>`;
r.querySelector(".name").textContent=it.name;r.querySelector(".unit").textContent=it.unit?"("+it.unit+")":"";
r.querySelector(".minus").onclick=()=>change(cat,i,-1);r.querySelector(".plus").onclick=()=>change(cat,i,1);r.querySelector(".delete").onclick=()=>del(cat,i);
let n=r.querySelector(".note");if(n){n.value=it.note||"";n.oninput=()=>{it.note=n.value;save()}}s.appendChild(r)});app.appendChild(s)})}
function change(c,i,d){data[c][i].qty=Math.max(0,(+data[c][i].qty||0)+d);data[c][i].updated=stamp();save();render()}
function del(c,i){if(confirm('Delete "'+data[c][i].name+'"?')){data[c].splice(i,1);save();render()}}
document.getElementById("reset").onclick=()=>{if(confirm("Reset all quantities to 0?")){Object.values(data).forEach(a=>a.forEach(x=>{x.qty=0;x.updated=stamp()}));save();render()}};
const dialog=document.getElementById("dialog");document.getElementById("add").onclick=()=>dialog.classList.add("show");dialog.onclick=e=>{if(e.target===dialog)dialog.classList.remove("show")};
document.getElementById("saveNew").onclick=()=>{let n=document.getElementById("newName").value.trim(),u=document.getElementById("newUnit").value.trim();if(!n)return;data["CUSTOM ITEMS"]??=[];data["CUSTOM ITEMS"].push({name:n,unit:u,qty:0,updated:null,note:""});save();render();document.getElementById("newName").value="";document.getElementById("newUnit").value="";dialog.classList.remove("show")};
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");render();
</script></body></html>
