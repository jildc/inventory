<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2a0b8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kinlove Kitchen"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Kinlove Kitchen inventory</title>
<style>:root{--p:#f2a0b8;--pp:#f8d5df;--y:#ffe6a5;--bg:#fffaf5;--ink:#4f3d43;--mut:#8d7b82;--line:#efd8df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{text-align:center;padding:22px 15px 14px;background:linear-gradient(135deg,#fff8ef,#fff4f7)}.logo{width:105px;height:105px;border-radius:50%;object-fit:cover}.h1{font-size:27px;font-weight:800;margin:10px 0 3px}.sub{color:var(--mut)}.bar{position:sticky;top:0;z-index:5;padding:10px;background:#fffaf5ee;backdrop-filter:blur(8px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}button{border:0;border-radius:15px;padding:11px 15px;font-weight:800;font-size:15px;color:var(--ink);background:var(--y)}button.pink{background:var(--pp)}.status{width:100%;text-align:center;color:var(--mut);font-size:12px}main{max-width:850px;margin:auto;padding:10px}section{background:white;border:1px solid var(--line);border-radius:21px;margin:14px 0;overflow:hidden}h2{margin:0;padding:15px 17px;background:linear-gradient(90deg,#fff0b8,#f9dce5);font-size:20px}.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:13px 15px;border-top:1px solid #f1e4e7}.name{font-weight:750}.updated{font-size:12px;color:var(--mut);margin-top:3px}.controls{display:flex;align-items:center;gap:6px}.controls button{min-width:44px;padding:10px}.minus{background:#f7d7df}.plus{background:var(--p)}.qty{min-width:52px;text-align:center;background:#fff0bc;border-radius:11px;padding:9px;font-size:20px;font-weight:800}.note{padding:14px;border-top:1px solid #f1e4e7}.note textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:13px;padding:10px;font:inherit}.locked .controls button,.locked textarea{opacity:.45;pointer-events:none}@media(max-width:560px){.item{grid-template-columns:1fr}.controls{justify-content:flex-end}}</style></head><body>
<header><img class="logo" src="logo.jpg"><div class="h1">Kinlove Kitchen inventory</div><div class="sub">Fresh ingredients, made with love ♡</div></header>
<div class="bar"><button id="lock">🔒 Locked</button><button id="add">＋ Add item</button><button id="reset" class="pink">Reset quantities</button><div id="status" class="status"></div></div><main id="app"></main>
<script>
const seed={"SNACKS": ["Churros", "Popcorn original", "Ramen mild", "Ramen spicy", "Fries/pax", "Pizza hawaiian", "Pizza No meat"], "Per piece": ["Egg", "Cheese (square)", "Ham", "Slice Bread"], "MEALS": ["Bacon/pax", "Can Cornbeef", "Can CornTuna", "Chicken Fillet", "Lumpia/2", "Chicken/pax", "Pancake/pax", "Take out Box for pancake", "Take out Sauce cup"], "Condiments and seasoning": ["Pineapple /set", "Rice / serving", "Ice / pax", "Chocolate dip in grams", "Mayo in grams", "BBQ sauce in grams", "Maggi Savor", "White Sugar in grams", "Brown Sugar in grams", "Oil in grams", "Salt in grams", "Cinnamon in grams"]};const KEY="kinlove-kitchen-data";let S=JSON.parse(localStorage.getItem(KEY)||"null")||{items:{},notes:"",locked:true};
function t(){return new Date().toLocaleString([],{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(x){return x.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){app.innerHTML="";for(const [cat,names] of Object.entries(seed)){let sec=document.createElement("section");sec.innerHTML="<h2>"+cat+"</h2>";for(const n of names)add(sec,n);if(cat==="Condiments and seasoning"){let d=document.createElement("div");d.className="note";d.innerHTML="<b>Notes</b><textarea placeholder='Add notes here...'>"+esc(S.notes)+"</textarea>";d.querySelector("textarea").oninput=e=>{if(!S.locked){S.notes=e.target.value;save()}};sec.append(d)}app.append(sec)}document.querySelectorAll("section").forEach(x=>x.classList.toggle("locked",S.locked));lock.textContent=S.locked?"🔒 Locked":"🔓 Unlocked";status.textContent=S.locked?"Inventory is locked — quantities are protected.":"Inventory is unlocked — you can edit quantities."}
function add(sec,n){let d=S.items[n]||{q:0,t:""};let r=document.createElement("div");r.className="item";r.innerHTML="<div><div class=name>"+esc(n)+"</div><div class=updated>"+(d.t?"Updated: "+esc(d.t):"Not updated yet")+"</div></div><div class=controls><button class=minus>−</button><div class=qty>"+d.q+"</div><button class=plus>＋</button></div>";r.querySelector(".minus").onclick=()=>chg(n,-1);r.querySelector(".plus").onclick=()=>chg(n,1);sec.append(r)}
function chg(n,d){if(S.locked)return;S.items[n].q=Math.max(0,S.items[n].q+d);S.items[n].t=t();save();render()}
lock.onclick=()=>{S.locked=!S.locked;save();render()};
add.onclick=()=>{if(S.locked)return alert("Unlock the inventory first.");let n=prompt("Item name:");if(n&&n.trim()){n=n.trim();if(S.items[n])return alert("That item already exists.");S.items[n]={q:0,t:""};seed["Added items"]=(seed["Added items"]||[]).concat(n);save();render()}};
reset.onclick=()=>{if(S.locked)return;if(confirm("Reset all quantities to 0?")){Object.values(S.items).forEach(x=>{x.q=0;x.t=t()});save();render()}};
for(const ns of Object.values(seed))for(const n of ns)if(!S.items[n])S.items[n]={q:0,t:""};save();render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
