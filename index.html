<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7b6c2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kinlove Inventory">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Kinlove Inventory</title>
<style>
:root{--pink:#f7a9ba;--pink2:#fde0e5;--yellow:#f7d477;--yellow2:#fff2c9;--brown:#6d4b2f;--cream:#fffaf5;--white:#fff;--green:#79956a;--shadow:0 8px 24px rgba(109,75,47,.10)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);color:var(--brown)}
button,input,textarea{font:inherit} button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:rgba(255,250,245,.96);backdrop-filter:blur(10px);border-bottom:1px solid #f3dfd4}
.header{max-width:900px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:58px;height:58px;object-fit:cover;border-radius:50%;box-shadow:0 3px 10px rgba(109,75,47,.12)}
.brand h1{font-size:20px;margin:0;color:#d96782}.brand small{color:#8a6b52}
main{max-width:900px;margin:auto;padding:16px 14px 100px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tab{border:0;border-radius:18px;padding:14px 10px;background:var(--yellow2);color:var(--brown);font-weight:800;box-shadow:var(--shadow)}
.tab.active{background:var(--pink2);outline:2px solid var(--pink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.action{border:0;border-radius:14px;padding:10px 13px;background:white;box-shadow:var(--shadow);color:var(--brown);font-weight:700}
.action.primary{background:var(--pink);color:white}.action.yellow{background:var(--yellow)}
.status{margin:10px 0 16px;padding:12px 14px;border-radius:16px;background:white;box-shadow:var(--shadow);font-size:13px}
.locked{border-left:5px solid var(--pink)}.unlocked{border-left:5px solid var(--green)}
.category{margin:18px 0}.category h2{font-size:16px;margin:0 0 9px;color:#b55d71}
.card{background:white;border-radius:18px;padding:12px;box-shadow:var(--shadow);margin:8px 0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;align-items:center}
.name{font-weight:650}.qty{width:82px;text-align:center;border:1px solid #ead8cf;border-radius:11px;padding:9px;background:#fffdfb}
.qty:disabled{background:#f5f1ee;color:#8b8179}
.unit{font-size:11px;color:#9a8575;margin-top:2px}
.notes{margin-top:8px;width:100%;min-height:48px;border:1px solid #ead8cf;border-radius:11px;padding:9px;resize:vertical}
.smallbtn{border:0;border-radius:10px;padding:9px 10px;background:#f8eee8;color:#795c46;font-weight:700}
.danger{background:#f7d9df;color:#a13e59}.hidden{display:none}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,250,245,.95);border-top:1px solid #f3dfd4;padding:9px;text-align:center;font-size:11px;color:#9a8575;z-index:9}
dialog{border:0;border-radius:22px;padding:0;width:min(92vw,430px);box-shadow:0 20px 70px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(60,35,25,.35)}.modal{padding:22px}.modal h3{margin-top:0}.modal input{width:100%;padding:12px;border:1px solid #e3d0c7;border-radius:12px;margin:7px 0 14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}.empty{padding:16px;text-align:center;color:#a08c7e;background:white;border-radius:16px}
@media(max-width:520px){.row{grid-template-columns:minmax(0,1fr) auto}.row .smallbtn{grid-column:2}.qty{width:74px}}
</style>
</head>
<body>
<header><div class="header">
<img class="logo" src="kinlove-logo.jpg" alt="KinLove Inventory logo">
<div class="brand"><h1>KinLove Inventory</h1><small>Flowers + Coffee</small></div>
</div></header>
<main>
<div class="tabs">
<button class="tab active" id="fohTab">📠 FOH Inventory</button>
<button class="tab" id="kitchenTab">🍳 Kitchen Inventory</button>
</div>
<div class="toolbar">
<button class="action primary" id="unlockBtn">🔓 Unlock</button>
<button class="action yellow" id="lockBtn">🔒 Finalize / Lock</button>
<button class="action" id="addBtn">➕ Add item</button>
<button class="action" id="undoBtn">↩️ Undo</button>
<button class="action" id="resetBtn">🔄 Reset quantities</button>
</div>
<div id="status" class="status locked">🔒 Inventory is locked. Unlock with your password to update quantities.</div>
<div id="app"></div>
</main>
<footer>KinLove Inventory • Works offline • Updates are timestamped</footer>

<dialog id="passwordDialog"><div class="modal">
<h3 id="passTitle">Unlock Inventory</h3>
<p id="passText">Enter your password.</p>
<input id="passwordInput" type="password" inputmode="numeric" placeholder="Password">
<div class="modal-actions"><button class="action" id="cancelPass">Cancel</button><button class="action primary" id="confirmPass">Continue</button></div>
</div></dialog>

<dialog id="itemDialog"><div class="modal">
<h3>Add item</h3>
<input id="newCategory" placeholder="Category (e.g. Ice Cream)">
<input id="newName" placeholder="Item name">
<label id="notesLabel" class="hidden">Notes<br><textarea id="newNotes" class="notes" placeholder="Notes (Condiments only)"></textarea></label>
<div class="modal-actions"><button class="action" id="cancelItem">Cancel</button><button class="action primary" id="saveItem">Add</button></div>
</div></dialog>

<script>
const defaultData={
FOH:[
["DRINKS",["Schweppes","Brr","Mountain dew","Coke zero","Sprite","500ml water","Pocari 500ml","Welch grape","Welch orange","Arizona lemon","Arizona peach"]],
["Cups & Packaging",["16oz cups","22 oz cups","cups cover","12oz papercups","Papercups cover","Brown kraft","Bk cover","White kraft","Wk cover"]],
["Cakes",["Classic Tiramisu cake","Matcha Tiramisu cake","Biscoff Tiramisu cake"]],
["Bouquets",["350 dried flowers","500 dried flowers","2000 peonies","1000 singlerose","1,500 preserved","2,500 preserved","3,500 preserved","1000/pax Pampass"]],
["Flowers + Coffee",["Flowers + coffee (799)"]],
["Ice Cream",[]],
["Condiments",["Sugar/pouch","Brown sugar in grams","White sugar in grams","Darkchoco powder in grams","Matcha powder in grams","Uji powder in grams","Hojicha powder in grams","Barley powder in grams","Blueberry Jam","Strawberry Jam","Mango Syrup","Blueberry Syrup","Mixedberry Syrup","Lemon Syrup","Calamansi Syrup","Frappe Syrup","Caramel Syrup","Choco drizzle","Caramel drizzle"]]
],
Kitchen:[
["SNACKS:",["Churros","Popcorn original","Ramen mild","Ramen spicy","Fries/pax","Pizza hawaiian","Pizza No meat"]],
["Per piece:",["Egg","Cheese (square)","Ham","Slice Bread"]],
["MEALS:",["Bacon/pax","Can Cornbeef","Can CornTuna","Chicken Fillet","Lumpia/2","Chicken/pax","Pancake/pax"]],
["Packaging:",["Take out Box for pancake","Take out Sauce cup"]],
["Condiments:",["Pineapple /set","Rice / serving","Ice / pax","Chocolate dip in grams","Mayo in grams","BBQ sauce in grams","Maggi Savor","White Sugar in grams","Brown Sugar in grams","Oil in grams","Salt in grams","Cinnamon in grams","Maple Syrup"]]
]};
const KEY="kinloveInventoryV1";
let state=JSON.parse(localStorage.getItem(KEY)||"null");
if(!state){state={data:structuredClone(defaultData),locked:true,password:null,history:[],lastUpdated:null};localStorage.setItem(KEY,JSON.stringify(state))}
let section="FOH";
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function timestamp(){return new Date().toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})}
function ensureItems(){for(const s of ["FOH","Kitchen"]){for(const cat of state.data[s]){cat[1]=cat[1].map(n=>typeof n==="string"?{name:n,qty:"",notes:""}:n)}}}
ensureItems(); save();
function render(){
$("fohTab").classList.toggle("active",section==="FOH");$("kitchenTab").classList.toggle("active",section==="Kitchen");
$("status").className="status "+(state.locked?"locked":"unlocked");
$("status").innerHTML=state.locked?"🔒 <b>Inventory locked.</b> Unlock with your password to update.":"🔓 <b>Inventory unlocked.</b> You can update quantities. "+(state.lastUpdated?("Last update: "+state.lastUpdated):"");
$("unlockBtn").textContent=state.locked?"🔓 Unlock":"🔐 Change password";
$("app").innerHTML="";
for(const cat of state.data[section]){
 const wrap=document.createElement("section");wrap.className="category";
 const h=document.createElement("h2");h.textContent=cat[0];wrap.appendChild(h);
 if(!cat[1].length){const e=document.createElement("div");e.className="empty";e.textContent="No items yet — use ➕ Add item.";wrap.appendChild(e)}
 cat[1].forEach((item,i)=>{
  const card=document.createElement("div");card.className="card";
  const row=document.createElement("div");row.className="row";
  const nm=document.createElement("div");nm.innerHTML='<div class="name"></div><div class="unit">Quantity</div>';nm.querySelector(".name").textContent=item.name;
  const input=document.createElement("input");input.className="qty";input.type="number";input.step="any";input.placeholder="0";input.value=item.qty;input.disabled=state.locked;
  input.addEventListener("change",()=>updateQty(cat[0],i,input.value));
  const del=document.createElement("button");del.className="smallbtn danger";del.textContent="🗑️";del.title="Delete item";del.disabled=state.locked;
  del.addEventListener("click",()=>deleteItem(cat[0],i));
  row.append(nm,input,del);card.appendChild(row);
  if(section==="Kitchen" && cat[0].toLowerCase().startsWith("condiments")){
    const ta=document.createElement("textarea");ta.className="notes";ta.placeholder="Notes for this condiment…";ta.value=item.notes||"";ta.disabled=state.locked;
    ta.addEventListener("change",()=>{item.notes=ta.value;commit()});card.appendChild(ta)
  }
  wrap.appendChild(card);
 });$("app").appendChild(wrap);
}
function snapshot(){state.history.push(JSON.stringify(state.data));if(state.history.length>20)state.history.shift()}
function commit(){state.lastUpdated=timestamp();localStorage.setItem(KEY,JSON.stringify(state));render()}
function updateQty(cat,i,val){if(state.locked)return;snapshot();state.data[section].find(x=>x[0]===cat)[1][i].qty=val;commit()}
function deleteItem(cat,i){if(state.locked)return;if(!confirm("Delete this item?"))return;snapshot();const c=state.data[section].find(x=>x[0]===cat);c[1].splice(i,1);commit()}
$("fohTab").onclick=()=>{section="FOH";render()};$("kitchenTab").onclick=()=>{section="Kitchen";render()};
$("lockBtn").onclick=()=>{if(!state.password){openPassword("Set Password","Create a password to protect inventory updates.",true);return}state.locked=true;save()};
$("unlockBtn").onclick=()=>openPassword(state.password?"Unlock Inventory":"Set Password",state.password?"Enter your password.":"Create a password to protect inventory updates.",!state.password);
function openPassword(title,text,setup=false){$("passTitle").textContent=title;$("passText").textContent=text;$("passwordInput").value="";$("passwordDialog").dataset.setup=setup;$("passwordDialog").showModal();setTimeout(()=>$("passwordInput").focus(),50)}
$("cancelPass").onclick=()=>$("passwordDialog").close();
$("confirmPass").onclick=()=>{
 const p=$("passwordInput").value;
 if(p.length<4){alert("Use at least 4 characters.");return}
 if($("passwordDialog").dataset.setup==="true"){state.password=p;state.locked=true;save();$("passwordDialog").close();alert("Password created. Tap Unlock to begin updating.");return}
 if(p===state.password){state.locked=false;save();$("passwordDialog").close()}else alert("Incorrect password.")
};
$("addBtn").onclick=()=>{
 if(state.locked){alert("Unlock the inventory first.");return}
 $("newCategory").value=section==="FOH"?"Ice Cream":"Condiments:";$("newName").value="";$("newNotes").value="";
 $("notesLabel").classList.toggle("hidden",section!=="Kitchen");$("itemDialog").showModal();
};
$("cancelItem").onclick=()=>$("itemDialog").close();
$("saveItem").onclick=()=>{
 const cat=$("newCategory").value.trim(), name=$("newName").value.trim();
 if(!cat||!name){alert("Enter a category and item name.");return}
 snapshot();let c=state.data[section].find(x=>x[0]===cat);if(!c){c=[cat,[]];state.data[section].push(c)}
 c[1].push({name,qty:"",notes:section==="Kitchen"&&cat.toLowerCase().startsWith("condiments")?$("newNotes").value:""});commit();$("itemDialog").close();
};
$("undoBtn").onclick=()=>{
 if(!state.history.length){alert("Nothing to undo.");return}
 state.data=JSON.parse(state.history.pop());state.lastUpdated=timestamp();localStorage.setItem(KEY,JSON.stringify(state));render()
};
$("resetBtn").onclick=()=>{
 if(state.locked){alert("Unlock the inventory first.");return}
 if(!confirm("Reset all quantities in this inventory section to blank?"))return
 snapshot();state.data[section].forEach(c=>c[1].forEach(i=>i.qty=""));commit()
};
render();
</script>
</body>
</html>
