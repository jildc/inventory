<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f29ab2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kinlove Kitchen inventory">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=10">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=10">
<link rel="manifest" href="./manifest.json?v=10">
<title>Kinlove Kitchen inventory</title>
<style>
:root{
 --pink:#f3a0b8;--pink2:#f8d6df;--yellow:#ffe6a8;--cream:#fffaf5;
 --ink:#55444b;--muted:#927f87;--line:#ead7dc;--white:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#fffaf5,#fffdfb);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,textarea{font:inherit}
.app{max-width:920px;margin:auto;padding:18px 16px 40px}
header{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:28px;padding:18px 20px;box-shadow:0 8px 25px rgba(112,75,87,.08);position:sticky;top:8px;z-index:5}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:74px;height:74px;border-radius:18px;object-fit:cover;border:2px solid #f1ccd6}
h1{font-size:28px;margin:0 0 4px;font-weight:800}
.subtitle{color:var(--muted);font-size:15px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:16px;padding:12px 16px;font-weight:750;cursor:pointer}
.add{background:var(--yellow);color:#69534b}.reset{background:var(--pink2);color:#6d4d58}
.lock{background:#5b4a51;color:#fff}.unlock{background:var(--yellow);color:#604f45}
.status{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:750}
.dot{width:10px;height:10px;border-radius:50%;background:#8f7b82}.dot.open{background:#e28aa5}
.notice{margin:16px 0 4px;padding:12px 14px;border-radius:16px;background:#fff2d1;color:#6e5a4e;font-size:14px}
section{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 6px 20px rgba(112,75,87,.06)}
.section-title{padding:17px 18px;background:linear-gradient(90deg,#fff0c8,#f9dbe3);font-size:20px;font-weight:850}
.row{padding:14px 14px 12px;border-top:1px solid #f0e4e7}
.rowtop{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.name{font-weight:750;font-size:17px}
.qty{min-width:62px;text-align:center;font-weight:900;font-size:22px;background:#fff0b7;padding:10px 9px;border-radius:13px;color:#b45b70}
.controls{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}
.small{width:44px;height:42px;border:0;border-radius:13px;font-size:23px;font-weight:900}
.minus{background:#f8dce4;color:#73515c}.plus{background:#f1a0b8;color:white}
.small:disabled{opacity:.38;cursor:not-allowed}
.time{font-size:12px;color:var(--muted);margin-top:6px}
.note{width:100%;margin-top:9px;border:1px solid #ecdce0;border-radius:12px;padding:9px;background:#fffdfb;min-height:42px;resize:vertical}
.delete{background:none;border:0;color:#c96d83;font-weight:700;margin-top:7px;cursor:pointer}
.locked .note,.locked .delete{pointer-events:none;opacity:.45}
.empty{padding:22px;color:var(--muted)}
dialog{border:0;border-radius:22px;padding:0;max-width:420px;width:calc(100% - 32px);box-shadow:0 20px 70px rgba(50,30,40,.25)}
dialog::backdrop{background:rgba(55,35,45,.4)}
.modal{padding:22px}.modal h2{margin-top:0}
.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:7px 0 14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:560px){.brand img{width:62px;height:62px}h1{font-size:23px}.app{padding:12px 10px 30px}}
</style>
</head>
<body>
<div class="app" id="app">
<header>
 <div class="brand">
   <img src="./kitchen-logo.jpg" alt="Kinlove Kitchen Inventory logo">
   <div><h1>Kinlove Kitchen inventory</h1><div class="subtitle">Fresh ingredients, made with love ♡</div></div>
 </div>
 <div class="toolbar">
   <button class="btn add" id="addBtn">＋ Add item</button>
   <button class="btn reset" id="resetBtn">Reset quantities</button>
   <button class="btn lock" id="lockBtn">🔒 Locked</button>
 </div>
 <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Inventory locked</span></div>
</header>
<div id="content"></div>
</div>

<dialog id="addDialog">
 <form class="modal" method="dialog" id="addForm">
  <h2>Add inventory item</h2>
  <label>Item name<input class="field" id="newName" required></label>
  <label>Section
   <select class="field" id="newSection">
    <option>SNACKS</option><option>PER PIECE</option><option>MEALS</option>
    <option>PACKAGING</option><option>CONDIMENTS & SEASONING</option>
   </select>
  </label>
  <div class="modal-actions"><button class="btn reset" value="cancel">Cancel</button><button class="btn add" value="default">Add</button></div>
 </form>
</dialog>

<script>
const DEFAULT_ITEMS = [{"name": "Churros", "section": "SNACKS"}, {"name": "Popcorn original", "section": "SNACKS"}, {"name": "Ramen mild", "section": "SNACKS"}, {"name": "Ramen spicy", "section": "SNACKS"}, {"name": "Fries/pax", "section": "SNACKS"}, {"name": "Pizza hawaiian", "section": "SNACKS"}, {"name": "Pizza No meat", "section": "SNACKS"}, {"name": "Egg", "section": "PER PIECE"}, {"name": "Cheese (square)", "section": "PER PIECE"}, {"name": "Ham", "section": "PER PIECE"}, {"name": "Slice Bread", "section": "PER PIECE"}, {"name": "Bacon/pax", "section": "MEALS"}, {"name": "Can Cornbeef", "section": "MEALS"}, {"name": "Can CornTuna", "section": "MEALS"}, {"name": "Chicken Fillet", "section": "MEALS"}, {"name": "Lumpia/2", "section": "MEALS"}, {"name": "Chicken/pax", "section": "MEALS"}, {"name": "Pancake/pax", "section": "MEALS"}, {"name": "Take out Box for pancake", "section": "PACKAGING"}, {"name": "Take out Sauce cup", "section": "PACKAGING"}, {"name": "Pineapple /set", "section": "CONDIMENTS & SEASONING"}, {"name": "Rice / serving", "section": "CONDIMENTS & SEASONING"}, {"name": "Ice / pax", "section": "CONDIMENTS & SEASONING"}, {"name": "Chocolate dip in grams", "section": "CONDIMENTS & SEASONING"}, {"name": "Mayo in grams", "section": "CONDIMENTS & SEASONING"}, {"name": "BBQ sauce in grams", "section": "CONDIMENTS & SEASONING"}, {"name": "Maggi Savor", "section": "CONDIMENTS & SEASONING"}, {"name": "White Sugar in grams", "section": "CONDIMENTS & SEASONING"}, {"name": "Brown Sugar in grams", "section": "CONDIMENTS & SEASONING"}, {"name": "Oil in grams", "section": "CONDIMENTS & SEASONING"}, {"name": "Salt in grams", "section": "CONDIMENTS & SEASONING"}, {"name": "Cinnamon in grams", "section": "CONDIMENTS & SEASONING"}];
const KEY="kinlove-kitchen-inventory-v10";
let state=JSON.parse(localStorage.getItem(KEY)||"null");
if(!state) state={locked:true,items:DEFAULT_ITEMS.map(x=>({...x,qty:0,updated:null,note:""}))};

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function fmt(t){
 if(!t)return "Not updated yet";
 return new Date(t).toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function render(){
 const content=document.getElementById("content");
 document.getElementById("statusText").textContent=state.locked?"Inventory locked":"Editing unlocked";
 document.getElementById("statusDot").className="dot"+(state.locked?"":" open");
 const lb=document.getElementById("lockBtn");
 lb.textContent=state.locked?"🔒 Locked":"🔓 Lock inventory";
 lb.className="btn "+(state.locked?"lock":"unlock");
 content.innerHTML="";
 const groups={};
 state.items.forEach((it,i)=>(groups[it.section]??=[]).push({...it,i}));
 Object.entries(groups).forEach(([section,arr])=>{
   const sec=document.createElement("section");
   sec.innerHTML=`<div class="section-title">${esc(section)}</div>`;
   arr.forEach(it=>{
     const r=document.createElement("div"); r.className="row";
     r.innerHTML=`
      <div class="rowtop"><div class="name">${esc(it.name)}</div><div class="qty">${it.qty}</div></div>
      <div class="controls">
       <button class="small minus" data-act="minus" data-i="${it.i}" ${state.locked?"disabled":""}>−</button>
       <button class="small plus" data-act="plus" data-i="${it.i}" ${state.locked?"disabled":""}>＋</button>
      </div>
      <div class="time">Updated: ${fmt(it.updated)}</div>
      ${section==="CONDIMENTS & SEASONING"?`<textarea class="note" data-note="${it.i}" placeholder="Notes..." ${state.locked?"disabled":""}>${esc(it.note||"")}</textarea>`:""}
      ${!state.locked?`<button class="delete" data-act="delete" data-i="${it.i}">Delete item</button>`:""}`;
     sec.appendChild(r);
   });
   content.appendChild(sec);
 });
}

document.addEventListener("click",e=>{
 const b=e.target.closest("button"); if(!b)return;
 if(b.id==="lockBtn"){
   state.locked=!state.locked; save(); render(); return;
 }
 if(b.id==="resetBtn"){
   if(state.locked){alert("Unlock the inventory first.");return}
   if(confirm("Reset all quantities to 0?")){const now=Date.now();state.items.forEach(x=>{x.qty=0;x.updated=now});save();render();}
   return;
 }
 if(b.id==="addBtn"){
   if(state.locked){alert("Unlock the inventory first.");return}
   document.getElementById("newName").value="";document.getElementById("addDialog").showModal();return;
 }
 const i=Number(b.dataset.i), act=b.dataset.act;
 if(!Number.isInteger(i))return;
 if(state.locked)return;
 if(act==="plus")state.items[i].qty++;
 if(act==="minus")state.items[i].qty=Math.max(0,state.items[i].qty-1);
 if(act==="delete"){
   if(!confirm(`Delete "${state.items[i].name}"?`))return;
   state.items.splice(i,1); save(); render(); return;
 }
 state.items[i].updated=Date.now(); save(); render();
});
document.addEventListener("input",e=>{
 const i=e.target.dataset.note;
 if(i===undefined || state.locked)return;
 state.items[Number(i)].note=e.target.value;
 save();
});
document.getElementById("addForm").addEventListener("submit",e=>{
 e.preventDefault();
 const name=document.getElementById("newName").value.trim();
 const section=document.getElementById("newSection").value;
 if(!name)return;
 state.items.push({name,section,qty:0,updated:null,note:""});
 save();render();document.getElementById("addDialog").close();
});
window.addEventListener("load",()=>{save();render();});
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js?v=10").catch(()=>{});
</script>
</body>
</html>
